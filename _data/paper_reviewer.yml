  how1_body: 의 <code>02_paper_proofreading.md</code>에서 페르소나, 심각도, 카테고리 A–I 규칙을 그대로 가져와요. 원본은 LaTeX 소스를 읽는다고 가정하므로, 소스에서만 확인할 수 있는 검사는 PDF에서 보이는 증상으로 바꾸고 출력은 JSON으로 받습니다.
  how2_title: 위치 찾기
  how2_body: 모델이 낸 좌표는 믿을 수 없어서, 이슈마다 <b>페이지 번호와 원문 인용</b>을 받아요. 페이지의 텍스트 레이어에서 그 인용문을 찾아 박스를 그리는데, 줄바꿈 하이픈과 공백 차이는 무시하고 비교해요. 끝내 못 찾은 이슈는 목록에 <i>위치 미확인</i>으로 남깁니다.
