  how3_body: "\"I am a harsh CVPR reviewer…\" 프롬프트에 학회별 평가 기준을 붙여 영어 리뷰를 받은 뒤, 그 리뷰를 그대로 한국어로 번역해요. 따로 생성하면 두 언어의 판정이 달라질 수 있기 때문이에요. API 모드에서는 PDF를 프롬프트 캐시에 올려 교정과 리뷰가 함께 씁니다."

en:
  title: Paper Reviewer · Jiwon Choi
  h1: Proofread it.<br>Then face <em>Reviewer&nbsp;2.</em>
  lead: Upload a paper PDF and Claude marks grammar, spelling, spacing, and capitalization problems <mark>right where they are on the page</mark>. Then it becomes a <b>harsh</b> or <b>typical</b> reviewer for the venue you pick and tells you whether it would accept or reject the paper, with reasons, in English and Korean.
  credit: Proofreading prompt by
  nav_try: Review a paper
  nav_how: How it works
  tagline: All it takes is a PDF. Mistakes are marked right on the page, <br>and a reviewer from your venue gives a verdict in English and Korean.
  teaser_caption: Grammar, spacing, capitalization, and overclaims are marked at their exact spot, and a reviewer decides accept or reject.
  try_title: Review your paper
  s1_title: Paper
  s1_sub: PDF and/or LaTeX source zip
  drop: Drop a PDF or LaTeX zip here
  choose_file: Choose file
  shrink_title: PDF too large?
  shrink_desc: Shrink it with Ghostscript and upload the result. This one line installs it and compresses the file, saving -small.pdf next to the original.
  drop_meta: "PDF up to 24 MB · add the Overleaf source zip and Claude reads the source too"
  src_remove: Remove source
  s2_title: Venue
  s2_sub: Review criteria follow the venue
  venue_custom: Venue name (e.g. ISMAR, ACM MM)
  s3_title: Reviewer
  s3_sub: How tough should it be?
  harsh_desc: Goes for the weaknesses first; rejects unless clearly above the bar
  typical_desc: Weighs strengths and weaknesses; separates fixable from fatal
  task_proof: Proofread the PDF
  task_review: Venue review EN · KR
  s4_title: How to run
  s4_sub: Your API key, or your own Claude account
  mode_api: API key
  mode_bridge: My Claude Code
  mode_manual: Paste
  bridge_desc: "Paste this into a terminal to connect <b>your own Claude Code</b>. It uses your plan's usage, not API billing. <span class=\"pr-dim\">Node 18+ · macOS/Linux (WSL on Windows)</span>"
  model_label: Model
  model_default: Default (your Claude Code setting)
  bridge_copy: Copy command
  bridge_view: Read the script
  bridge_off: Not connected
  bridge_code: "Pairing code (e.g. 43117-xxxx)"
  bridge_connect: Connect
  model_cheap: cheaper
  remember: Remember the key in this browser
  run_api: Start review
  run_manual: Build prompts
  privacy: Your key and PDF go straight from this browser to the Anthropic API and never touch this blog's server. For an unpublished manuscript, check your institution's policy first.
  manual_desc: Runs on the account you're already signed in to in <b>claude.ai</b> or <b>Claude Code</b>. This page builds the prompt; you paste it next to the PDF, then paste Claude's JSON answer back here and get the same highlights and review. It uses your plan's usage instead of API billing.
  manual_title: Run it with your Claude account
  manual_sub: For each task, copy the prompt, paste it into Claude, then paste the answer back.
  manual_web: <b>claude.ai</b>&nbsp;Start a new chat, attach the PDF, and paste the prompt.
  manual_cc: <b>Claude Code</b>&nbsp;Run <code>claude</code> in the PDF's folder and paste the prompt after <code>@paper.pdf</code>.
  manual_open: Open claude.ai
  manual_copy: Copy prompt
  manual_download: Save as .md
  manual_paste: Paste Claude's JSON answer here
  manual_upload: JSON file
  manual_load: Load result
  manual_proof_title: Proofreading
  manual_review_title: Review
  history_title: History
  history_note: Saved in this browser only · last 20 runs · kept until you reset
  history_reset: Reset all
  tab_proof: Proofreading
  tab_review: Review
  tab_revise: Check revision
  rev_need: Run a proofreading pass first, or open one from History. This tab checks whether those issues are fixed in your revision.
  rev_upload_title: Upload the revision
  rev_upload_note: Upload a PDF you compiled, or the Overleaf source zip; the bridge compiles it and the Claude check reads the source too.
  rev_zip: Choose source zip
  rev_upload: Choose revised PDF
  rev_latex_title: Compile a LaTeX folder
  rev_latex_note: The Claude Code bridge compiles it on your machine with latexmk (or pdflatex). Give the folder's absolute path and the main file. The build goes to a temp folder; your project folder is left untouched.
  rev_dir: LaTeX project folder (absolute path)
  rev_main: Main .tex file
  rev_compile: Compile and compare
  rev_view_inline: Inline
  rev_view_split: Side by side
  rev_inline_label: Revision · additions highlighted, deletions as struck-through notes
  rev_old: Previous version (removed)
  rev_new: Revision (added)
  export_pdf: Annotated PDF
  export_md: Review .md
  how_title: Quote, <em>don't guess</em> coordinates.
  how1_title: The proofreading prompt
  how1_body: "'s <code>02_paper_proofreading.md</code> supplies the persona, severity levels, and category A–I rules verbatim. The original assumes it can read LaTeX source, so checks that only work on source are swapped for their visible symptoms in the PDF, and the output comes back as JSON."
  how2_title: Finding the spot
  how2_body: Coordinates from a model can't be trusted, so every issue comes with a <b>page number and a verbatim quote</b>. The page's text layer is searched for that quote and the match becomes the box, ignoring line-break hyphens and spacing differences. Issues that still can't be found stay in the list as <i>not located</i>.
  how3_title: Review, then translate
  how3_body: The "I am a harsh CVPR reviewer…" prompt plus venue-specific criteria produces an English review, which is then translated into Korean as is. Generating the two separately could give different verdicts. In API mode the PDF sits in the prompt cache, so proofreading and review share it.
